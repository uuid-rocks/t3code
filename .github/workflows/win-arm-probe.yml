# TEMPORARY: probe for runner labels. Removed before merge.
name: Win ARM probe
on:
  push:
    branches: [ci/win-arm-speed]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - blacksmith-4vcpu-windows-2025-arm
          - blacksmith-8vcpu-windows-2025-arm
          - blacksmith-16vcpu-windows-2025-arm
          - blacksmith-8vcpu-windows-11-arm
          - blacksmith-8vcpu-windows-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - shell: pwsh
        run: |
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          (Get-CimInstance Win32_Processor).Name
          [Environment]::ProcessorCount
          Get-CimInstance Win32_OperatingSystem | Select Caption, Version
          Get-PSDrive -PSProvider FileSystem
          $PSVersionTable.PSVersion
          (Get-MpComputerStatus).RealTimeProtectionEnabled
          Get-Location
