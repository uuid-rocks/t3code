# bsv recheck round 8: a second PR-triggered workflow file with release env (rubric 16 variant). Its entry is saved
# under the PR's merge SHA; ci.yml then runs on the same merge SHA when the PR is labelled.
name: BSV r8 PR Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [bsv/r8-xwfb]
permissions:
  contents: read
env:
  BSV_MODE: select
  BSV_XWF_CHANNEL: release
jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Checkout facts
        run: git log --oneline -1; git rev-parse --is-shallow-repository; git rev-list --count HEAD
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/provider-core...
          save-pnpm-store: "false"
      - name: Select provider-core tests
        working-directory: packages/provider-core
        run: vp test run --config bsv-r3.config.ts --dir . --maxWorkers 3
