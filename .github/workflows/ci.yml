# bsv recheck round 7: probe workflow for a browser setup-file transform failure (rubric 23n).
# apps/web browser project, shard 1/8 (scope written by no earlier run); the control runs the
# same shard with the plugin off, so it never saves an entry.
name: CI
on:
  pull_request:
  push:
    branches: [bsv/r7-bw40]
permissions:
  contents: read
concurrency:
  group: probe-${{ github.event.pull_request.number || github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false
env:
  BSV_MODE: select
  BSV_DEPS: "{}"
jobs:
  probe:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium
      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi
      - name: Select browser shard 1/8
        working-directory: apps/web
        run: vp test run --project browser --shard 1/8
      - name: Control browser shard 1/8 (plugin off)
        if: always() && !cancelled()
        working-directory: apps/web
        env:
          BSV_MODE: "off"
        run: vp test run --project browser --shard 1/8
