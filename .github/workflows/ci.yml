# bsv recheck round 8: PR-triggered second workflow saves, ci.yml restores at the same merge SHA (rubric 16 variant).
# ci.yml runs only when the PR is labelled, after the PR gate below has saved its entry.
name: CI
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
env:
  BSV_MODE: select
jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Checkout facts
        run: git log --oneline -1; git rev-parse --is-shallow-repository; git rev-list --count HEAD
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/provider-core...
          save-pnpm-store: "false"
      - name: Select provider-core tests
        working-directory: packages/provider-core
        run: vp test run --config bsv-r3.config.ts --dir . --maxWorkers 3
      - name: Control provider-core (runAllTests)
        if: always() && !cancelled()
        working-directory: packages/provider-core
        env:
          BSV_MODE: all
        run: vp test run --config bsv-r3.config.ts --dir . --maxWorkers 3
      - name: Control provider-core (plugin off)
        if: always() && !cancelled()
        working-directory: packages/provider-core
        env:
          BSV_MODE: "off"
        run: vp test run --config bsv-r3.config.ts --dir . --maxWorkers 3
