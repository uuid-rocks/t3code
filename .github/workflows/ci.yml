# bsv recheck round 8: runner-tool drift on CI (rubric 23l). The commit never changes; a dispatch input puts a git
# that rejects --ref-format=reftable first on PATH, as a runner image change would, with no repository change.
name: CI
on:
  workflow_dispatch:
    inputs:
      wrap:
        type: choice
        options: ["false", "true"]
      mode:
        type: choice
        options: [select, all, "off"]
permissions:
  contents: read
env:
  BSV_MODE: ${{ inputs.mode }}
jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
      - name: Put the reftable-rejecting git first on PATH
        if: inputs.wrap == 'true'
        run: echo "$GITHUB_WORKSPACE/.github/bsv-r8/wrap-noreftable" >> "$GITHUB_PATH"
      - name: Tool facts
        run: command -v git; git --version; git init -q --ref-format=reftable "$RUNNER_TEMP/rt" && echo reftable-ok || echo reftable-rejected; cat /etc/os-release | head -2
      - name: Test GitVcsDriverCore and gitIndexStat
        run: cd apps/server && vp test run --config bsv-r8git.config.ts --maxWorkers 4
