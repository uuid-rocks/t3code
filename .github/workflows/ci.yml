# bsv recheck round 3: cross-workflow restore probe (rubric 16). ci.yml side.
name: CI
on:
  pull_request:
  push:
    branches: [bsv/r3-xwf]
permissions:
  contents: read
concurrency:
  group: probe-r3-${{ github.event.pull_request.number || github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false
env:
  BSV_MODE: select
jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/provider-core...
          save-pnpm-store: "false"
      - name: Select provider-core tests
        working-directory: packages/provider-core
        run: vp test run --config bsv-r3.config.ts --dir . --maxWorkers 3
      - name: Control provider-core (runAllTests)
        if: always() && !cancelled()
        working-directory: packages/provider-core
        env:
          BSV_MODE: all
        run: vp test run --config bsv-r3.config.ts --dir . --maxWorkers 3
