name: CI
on: [pull_request]
permissions:
  contents: read
  id-token: write
concurrency:
  group: bsv-sol2-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/shared... --filter effect-acp...
          save-pnpm-store: "false"
      - name: Select shared tests
        working-directory: packages/shared
        env:
          BSV_MODE: select
        run: vp test run --config bsv-ci.config.ts --dir . --exclude "**/nodeSqliteClient.test.ts" --maxWorkers 2
      - name: Select ACP tests
        if: always() && !cancelled()
        working-directory: packages/effect-acp
        env:
          BSV_MODE: select
        run: vp test run --config bsv-ci.config.ts --dir . --maxWorkers 2
