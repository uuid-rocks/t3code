# bsv recheck round 5 probe workflow (r5t).
# Fresh project names (bsv-r5t-*) give scopes no earlier run wrote. Controls run with the
# plugin off, so they never save an entry.
name: CI
on:
  pull_request:
  push:
    branches: [bsv/r5-u61t]
permissions:
  contents: read
concurrency:
  group: probe-${{ github.event.pull_request.number || github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false
env:
  BSV_MODE: select
jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/shared... --filter effect-acp... --filter @t3tools/provider-core...
          save-pnpm-store: "false"
      - name: Select ACP tests
        working-directory: packages/effect-acp
        run: vp test run --config bsv-r5t.config.ts --dir . --maxWorkers 3
      - name: Select provider-core tests
        if: always() && !cancelled()
        working-directory: packages/provider-core
        run: vp test run --config bsv-r5t.config.ts --dir . --maxWorkers 3
      - name: Select shared tests
        if: always() && !cancelled()
        working-directory: packages/shared
        run: vp test run --config bsv-r5t.config.ts --dir . --exclude "**/nodeSqliteClient.test.ts" --maxWorkers 3
      - name: Control ACP (plugin off)
        if: always() && !cancelled()
        working-directory: packages/effect-acp
        env:
          BSV_MODE: "off"
        run: vp test run --config bsv-r5t.config.ts --dir . --maxWorkers 3
      - name: Control provider-core (plugin off)
        if: always() && !cancelled()
        working-directory: packages/provider-core
        env:
          BSV_MODE: "off"
        run: vp test run --config bsv-r5t.config.ts --dir . --maxWorkers 3
      - name: Control shared (plugin off)
        if: always() && !cancelled()
        working-directory: packages/shared
        env:
          BSV_MODE: "off"
        run: vp test run --config bsv-r5t.config.ts --dir . --exclude "**/nodeSqliteClient.test.ts" --maxWorkers 3
      - name: Filtered provider-core run (one named file, plugin in select mode)
        if: always() && !cancelled()
        working-directory: packages/provider-core
        run: vp test run --config bsv-r5t.config.ts --dir . --maxWorkers 3 src/server/textGenerationUtils.test.ts
      - name: Control filtered provider-core run (plugin off)
        if: always() && !cancelled()
        working-directory: packages/provider-core
        env:
          BSV_MODE: "off"
        run: vp test run --config bsv-r5t.config.ts --dir . --maxWorkers 3 src/server/textGenerationUtils.test.ts
