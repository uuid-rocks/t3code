# bsv recheck round 8: same-SHA cross-workflow restore probe (rubric 16a), ci.yml side.
name: CI
on:
  push:
    branches: [bsv/r8-xwfa]
permissions:
  contents: read
env:
  BSV_MODE: select
jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Checkout facts
        run: git log --oneline -1; git rev-parse --is-shallow-repository; git rev-list --count HEAD
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/provider-core...
          save-pnpm-store: "false"
      - name: Select provider-core tests
        working-directory: packages/provider-core
        run: vp test run --config bsv-r3.config.ts --dir . --maxWorkers 3
      - name: Control provider-core (plugin off)
        if: always() && !cancelled()
        working-directory: packages/provider-core
        env:
          BSV_MODE: "off"
        run: vp test run --config bsv-r3.config.ts --dir . --maxWorkers 3
