# bsv recheck round 7: issue 3(c) probe. T3_MOBILE_TEST_PLATFORM comes from a workflow_dispatch input, so it can
# change with no file change. apps/mobile projects unit-r7/react-r7 (scope written by no earlier run).
name: CI
on:
  push:
    branches: [bsv/r7-mob61]
  workflow_dispatch:
    inputs:
      mobile_platform:
        type: string
        default: ""
permissions:
  contents: read
env:
  BSV_MODE: select
  BSV_DEPS: "{}"
jobs:
  probe:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"
      - name: Generate mobile Metro files
        working-directory: apps/mobile
        run: node -e 'require("./metro.config.js").then(() => process.exit(0))'
      - name: Select mobile tests
        working-directory: apps/mobile
        env:
          T3_MOBILE_TEST_PLATFORM: ${{ inputs.mobile_platform }}
        run: echo "T3_MOBILE_TEST_PLATFORM=[$T3_MOBILE_TEST_PLATFORM]" && vp test run --project unit-r7 --project react-r7
      - name: Control mobile tests (plugin off)
        if: always() && !cancelled()
        working-directory: apps/mobile
        env:
          BSV_MODE: "off"
          T3_MOBILE_TEST_PLATFORM: ${{ inputs.mobile_platform }}
        run: echo "T3_MOBILE_TEST_PLATFORM=[$T3_MOBILE_TEST_PLATFORM]" && vp test run --project unit-r7 --project react-r7
