name: CI

# bsv r2 web campaign: Test Web only. A PR runs the plugin in select mode, then a
# runAllTests control at the same SHA with a cold Vite optimizer cache.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      arm:
        type: choice
        options: [seed-a, seed-b]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BSV_MODE: ${{ (inputs.arm == 'seed-a' && 'all') || ((inputs.arm == 'seed-b' || endsWith(github.head_ref, '-b')) && 'off') || 'select' }}

jobs:
  test_web:
    permissions:
      contents: read
      id-token: write
    name: Test Web
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          task-cache-read-token: ${{ secrets.T3_TASK_CACHE_READ_TOKEN }}

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        continue-on-error: true
        run: |
          trap 'bash "$GITHUB_WORKSPACE/.github/scripts/bsv-report.sh" test_web "$SECONDS"' EXIT
          vp run --filter @t3tools/web test

      - name: Control
        if: always() && github.event_name == 'pull_request'
        env:
          BSV_MODE: all
        run: |
          rm -rf apps/web/node_modules/.vite node_modules/.vite node_modules/.vitest-cache apps/web/node_modules/.vitest-cache
          : > "$RUNNER_TEMP/bsv-selection.log"
          trap 'bash "$GITHUB_WORKSPACE/.github/scripts/bsv-report.sh" test_web_control "$SECONDS"' EXIT
          cd apps/web && vp test run --passWithNoTests --project unit --project browser
