# bsv recheck round 8: record growth on one server shard (rubric 10, L14). Every push to the branch runs shard 2/8 of
# apps/server with runAllTests under its own project name (scope bsv-r8grow), then prints the record sizes.
name: CI
on:
  push:
    branches: [bsv/r8-grow61]
permissions:
  contents: read
env:
  BSV_MODE: all
jobs:
  grow:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Test Server 2 (runAllTests)
        run: >-
          cd apps/server && vp test run --config bsv-r8grow.config.ts --shard 2/8
          --fileParallelism --maxWorkers 4 --exclude integration/transferBudgetV2.integration.test.ts
      - name: Record sizes
        if: always()
        run: |
          echo "BSV_GROW installed=$(node -p "require('./node_modules/@useblacksmith/vitest/package.json').version")"
          find apps/server/node_modules/.vite/vitest -type f \( -name 'dependencies.json' -o -name 'blacksmith*.json' \) -printf 'BSV_GROW %s %p\n' 2>/dev/null || true
