# bsv recheck round 8: partial records after a failure on CI (rubric 10a, L3), 0.6.1 as published.
name: CI
on:
  push:
    branches: [bsv/r8-p1]
permissions:
  contents: read
env:
  BSV_MODE: select
jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/tailscale...
          save-pnpm-store: "false"
      - name: Select tailscale tests
        working-directory: packages/tailscale
        run: vp test run --config bsv-r8p1.config.ts --dir . --maxWorkers 3
      - name: Control tailscale (plugin off)
        if: always() && !cancelled()
        working-directory: packages/tailscale
        env:
          BSV_MODE: "off"
        run: vp test run --config bsv-r8p1.config.ts --dir . --maxWorkers 3
