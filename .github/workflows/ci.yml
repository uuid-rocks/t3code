# bsv recheck round 1: isolated probe workflow for @useblacksmith/vitest issue re-tests.
# The bases bsv/r1-u040 and bsv/r1-u061 differ only in the plugin version (no restore patch).
name: CI
on:
  pull_request:
  push:
    branches: [bsv/r1-u040, bsv/r1-u061]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [select, all]
        default: select
permissions:
  contents: read
concurrency:
  group: probe-${{ github.event.pull_request.number || github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false
env:
  BSV_MODE: ${{ inputs.mode || 'select' }}
jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/shared... --filter effect-acp... --filter @t3tools/provider-core...
          save-pnpm-store: "false"
      - name: Select ACP tests
        working-directory: packages/effect-acp
        run: vp test run --config bsv-r1.config.ts --dir . --maxWorkers 3
      - name: Dump effect-acp dependency snapshots (after Select ACP)
        if: always() && !cancelled()
        working-directory: packages/effect-acp
        run: |
          for f in node_modules/.vite/vitest/*/*.json; do echo "=== $f $(wc -c < "$f") bytes"; python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); d.pop("results", None); print(json.dumps(d, sort_keys=True))' "$f" | cut -c1-200000; done
      - name: Select provider-core tests
        if: always() && !cancelled()
        working-directory: packages/provider-core
        run: vp test run --config bsv-r1.config.ts --dir . --maxWorkers 3
      - name: Select shared tests
        if: always() && !cancelled()
        working-directory: packages/shared
        run: vp test run --config bsv-r1.config.ts --dir . --exclude "**/nodeSqliteClient.test.ts" --maxWorkers 3
      - name: Select ACP tests with a failing coverage threshold
        if: always() && !cancelled()
        working-directory: packages/effect-acp
        run: vp test run --config bsv-r1-cov.config.ts --dir . --maxWorkers 3
      - name: Dump effect-acp dependency snapshots (after the coverage step)
        if: always() && !cancelled()
        working-directory: packages/effect-acp
        run: |
          for f in node_modules/.vite/vitest/*/*.json; do echo "=== $f $(wc -c < "$f") bytes"; python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); d.pop("results", None); print(json.dumps(d, sort_keys=True))' "$f" | cut -c1-200000; done
      - name: Control ACP (runAllTests)
        if: always() && !cancelled()
        working-directory: packages/effect-acp
        env:
          BSV_MODE: all
        run: vp test run --config bsv-r1.config.ts --dir . --maxWorkers 3
      - name: Control provider-core (runAllTests)
        if: always() && !cancelled()
        working-directory: packages/provider-core
        env:
          BSV_MODE: all
        run: vp test run --config bsv-r1.config.ts --dir . --maxWorkers 3
      - name: Control shared (runAllTests)
        if: always() && !cancelled()
        working-directory: packages/shared
        env:
          BSV_MODE: all
        run: vp test run --config bsv-r1.config.ts --dir . --exclude "**/nodeSqliteClient.test.ts" --maxWorkers 3
